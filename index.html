<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Keuangan</title>
    <style>
        /* --- RESET & BASIC STYLE --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
        }

        .title {
            text-align: center;
            color: #333333;
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        /* Class untuk menyembunyikan elemen */
        .hidden {
            display: none !important;
        }

        /* --- STYLING UNTUK LOGIN --- */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #4361ee;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background-color: #4361ee;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #3f37c9;
        }

        /* --- STYLING UNTUK MENU DASHBOARD --- */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
        }

        .menu-item {
            background-color: #4361ee;
            color: white;
            padding: 20px 10px;
            border-radius: 10px;
            text-align: center;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(67, 97, 238, 0.3);
        }

        .menu-item:hover {
            background-color: #3f37c9;
            transform: translateY(-3px); 
        }

        .menu-item .icon {
            font-size: 28px;
        }

        .menu-item.full-width {
            grid-column: span 2; 
        }

        @media (max-width: 320px) {
            .menu-grid {
                grid-template-columns: 1fr; 
            }
            .menu-item.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div id="login-section" class="container">
        <h2 class="title">Silakan Login</h2>
        <form id="login-form">
            <div class="form-group">
                <input type="text" id="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>
            <button type="submit" class="btn-login">Masuk</button>
        </form>
    </div>

    <div id="dashboard-section" class="container hidden">
        <h2 class="title">Menu Aplikasi</h2>
        
        <div class="menu-grid">
            <a href="https://simpanuang.github.io/keuangan.html" class="menu-item">
                <span class="icon">💰</span>
                Catatan Keuangan
            </a>
            <a href="https://simpanuang.github.io/transaksi.html" class="menu-item">
                <span class="icon">🛒</span>
                Penjualan
            </a>
            <a href="https://simpanuang.github.io/nabung.html" class="menu-item">
                <span class="icon">🏦</span>
                Nabung
            </a>
            <a href="https://simpanuang.github.io/pinjaman.html" class="menu-item">
                <span class="icon">💳</span>
                Pinjaman
            </a>
            <a href="#" class="menu-item full-width">
                <span class="icon">📝</span>
                Note / Catatan
            </a>
        </div>
    </div>

    <script type="module">
        // 1. Import Firebase SDK versi terbaru
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // 2. KONFIGURASI FIREBASE KAMU (Sesuai dengan project login-3651c)
        const firebaseConfig = {
            apiKey: "AIzaSyAJkcYFCW2aSGKoP0wFSXoLvxDtXHOF7XI",
            authDomain: "login-3651c.firebaseapp.com",
            projectId: "login-3651c",
            storageBucket: "login-3651c.firebasestorage.app",
            messagingSenderId: "899318509963",
            appId: "1:899318509963:web:793158c5bda7407149ff8e",
            measurementId: "G-KJLCEH7TZM"
        };

        // Inisialisasi aplikasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Ambil elemen dari HTML
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('login-form');

        // 3. CEK SESI LOGIN SAAT INI
        // Jika sudah login di sesi tab ini, langsung tampilkan dashboard
        if (sessionStorage.getItem('isLoggedIn') === 'true') {
            loginSection.classList.add('hidden');
            dashboardSection.classList.remove('hidden');
        }

        // 4. PROSES SUBMIT LOGIN
        loginForm.addEventListener('submit', function(event) {
            event.preventDefault(); // Mencegah reload halaman

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // TRIK: Gabungkan username yang diketik dengan domain fiktif
            // Pastikan di menu Authentication > Users Firebase, user didaftarkan dengan email: username@aplikasiku.com
            const fakeEmail = username + "@aplikasiku.com";

            // Ubah teks tombol saat memproses
            const btnSubmit = document.querySelector('.btn-login');
            btnSubmit.innerText = "Memproses...";

            // Kirim permintaan login ke Firebase
            signInWithEmailAndPassword(auth, fakeEmail, password)
                .then((userCredential) => {
                    // Login Berhasil!
                    // Simpan status login di sessionStorage (hilang otomatis saat browser ditutup)
                    sessionStorage.setItem('isLoggedIn', 'true');
                    
                    // Sembunyikan login, tampilkan dashboard
                    loginSection.classList.add('hidden');
                    dashboardSection.classList.remove('hidden');
                    
                    // Kosongkan form dan kembalikan teks tombol
                    loginForm.reset();
                    btnSubmit.innerText = "Masuk";
                })
                .catch((error) => {
                    // Login Gagal!
                    alert("Login Gagal! Pastikan username dan password benar.");
                    btnSubmit.innerText = "Masuk"; // Kembalikan teks tombol
                    console.error("Error Firebase:", error.message);
                });
        });
    </script>

</body>
</html>
