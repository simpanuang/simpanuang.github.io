<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Modal & Alokasi Keuntungan</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            max-width: 400px;
            width: 100%;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            font-size: 1.4rem;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 600;
            font-size: 0.9rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #007bff;
        }
        .result-box {
            background-color: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            margin-bottom: 20px;
            text-align: center;
        }
        .result-box h3 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #333;
        }
        .result-box .amount {
            font-size: 1.5rem;
            font-weight: bold;
            color: #28a745;
        }
        .result-box .loss {
            color: #dc3545;
        }
        hr {
            border: 0;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
        .allocation-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 4px solid #007bff;
        }
        .allocation-group.simpanan { border-left-color: #17a2b8; }
        .allocation-group.pokok { border-left-color: #fd7e14; }
        .allocation-group.reward { border-left-color: #6f42c1; }
        
        .allocation-details {
            flex-grow: 1;
        }
        .allocation-title {
            font-weight: bold;
            color: #333;
            font-size: 0.9rem;
        }
        .allocation-amount {
            font-size: 1.1rem;
            color: #555;
            margin-top: 3px;
        }
        .percentage-input {
            width: 70px;
            display: flex;
            align-items: center;
        }
        .percentage-input input {
            width: 100%;
            padding: 5px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Kalkulator Keuntungan</h2>

    <div class="form-group">
        <label for="modal">Total Modal (Rp)</label>
        <input type="number" id="modal" placeholder="Contoh: 1000000" oninput="hitungSemua()">
    </div>

    <div class="form-group">
        <label for="pendapatan">Total Pendapatan (Rp)</label>
        <input type="number" id="pendapatan" placeholder="Contoh: 1500000" oninput="hitungSemua()">
    </div>

    <div class="result-box">
        <h3>Keuntungan Bersih</h3>
        <div class="amount" id="keuntungan">Rp 0</div>
    </div>

    <hr>

    <h2>Alokasi Keuntungan</h2>
    <p style="font-size: 0.8rem; color: #777; margin-top: -10px; text-align: center;">Ubah persentase sesuai kebutuhan</p>

    <!-- Dana Simpanan -->
    <div class="allocation-group simpanan">
        <div class="allocation-details">
            <div class="allocation-title">Dana Simpanan</div>
            <div class="allocation-amount" id="hasil-simpanan">Rp 0</div>
        </div>
        <div class="percentage-input">
            <input type="number" id="persen-simpanan" value="20" oninput="hitungSemua()"> <span style="margin-left:5px;">%</span>
        </div>
    </div>

    <!-- Dana Kebutuhan Pokok -->
    <div class="allocation-group pokok">
        <div class="allocation-details">
            <div class="allocation-title">Kebutuhan Pokok</div>
            <div class="allocation-amount" id="hasil-pokok">Rp 0</div>
        </div>
        <div class="percentage-input">
            <input type="number" id="persen-pokok" value="50" oninput="hitungSemua()"> <span style="margin-left:5px;">%</span>
        </div>
    </div>

    <!-- Dana Reward Diri Sendiri -->
    <div class="allocation-group reward">
        <div class="allocation-details">
            <div class="allocation-title">Reward Diri Sendiri</div>
            <div class="allocation-amount" id="hasil-reward">Rp 0</div>
        </div>
        <div class="percentage-input">
            <input type="number" id="persen-reward" value="30" oninput="hitungSemua()"> <span style="margin-left:5px;">%</span>
        </div>
    </div>
</div>

<script>
    // Fungsi untuk memformat angka menjadi format Rupiah
    const formatRupiah = (angka) => {
        return new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR',
            minimumFractionDigits: 0
        }).format(angka);
    };

    function hitungSemua() {
        // Ambil nilai modal dan pendapatan
        const modal = parseFloat(document.getElementById('modal').value) || 0;
        const pendapatan = parseFloat(document.getElementById('pendapatan').value) || 0;
        
        // Hitung Keuntungan
        const keuntungan = pendapatan - modal;
        const elKeuntungan = document.getElementById('keuntungan');

        if (keuntungan < 0) {
            elKeuntungan.textContent = formatRupiah(keuntungan) + " (Rugi)";
            elKeuntungan.classList.add('loss');
        } else {
            elKeuntungan.textContent = formatRupiah(keuntungan);
            elKeuntungan.classList.remove('loss');
        }

        // Ambil persentase alokasi
        const pSimpanan = parseFloat(document.getElementById('persen-simpanan').value) || 0;
        const pPokok = parseFloat(document.getElementById('persen-pokok').value) || 0;
        const pReward = parseFloat(document.getElementById('persen-reward').value) || 0;

        // Jika ada untung, bagi dananya. Jika rugi atau 0, set alokasi ke 0
        const danaSimpanan = keuntungan > 0 ? (keuntungan * pSimpanan / 100) : 0;
        const danaPokok = keuntungan > 0 ? (keuntungan * pPokok / 100) : 0;
        const danaReward = keuntungan > 0 ? (keuntungan * pReward / 100) : 0;

        // Tampilkan hasil alokasi
        document.getElementById('hasil-simpanan').textContent = formatRupiah(danaSimpanan);
        document.getElementById('hasil-pokok').textContent = formatRupiah(danaPokok);
        document.getElementById('hasil-reward').textContent = formatRupiah(danaReward);
    }
</script>

</body>
</html>
