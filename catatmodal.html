<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pencatatan Modal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --secondary: #f1f5f9;
      --secondary-hover: #e2e8f0;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Total Modal di Tengah Atas */
    .top-stats-container {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-width: 250px;
    }

    .stat-card .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 20px;
      font-weight: 700;
      color: var(--primary);
    }

    /* Kartu & Form Umum */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper span {
      position: absolute;
      left: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      pointer-events: none;
    }

    .input-wrapper input {
      padding-left: 36px !important;
    }

    input, select {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-main);
      background-color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    select {
      cursor: pointer;
    }

    /* Layout Form Modal */
    .modal-form-row {
      display: grid;
      grid-template-columns: 150px 1fr 1.5fr; /* Tanggal | Nominal | Keterangan */
      gap: 12px;
      margin-bottom: 16px;
    }

    .form-actions {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-submit {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      height: 38px;
      white-space: nowrap;
      width: max-content;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }
    
    .btn-submit.btn-edit-mode {
      background-color: var(--warning);
    }

    /* Area Sortir/Filter */
    .filter-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background-color: var(--secondary);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .filter-group select {
      border: none;
      background-color: transparent;
      padding: 6px 10px;
      height: 30px;
      font-weight: 600;
      box-shadow: none;
    }
    
    .filter-group select:focus {
      box-shadow: none;
      background-color: #ffffff;
      border-radius: 6px;
    }

    .custom-date-group {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-right: 6px;
    }

    .custom-date-group input {
      padding: 4px 8px;
      height: 30px;
    }

    /* Pengaturan Tabel */
    .table-container {
      width: 100%;
      max-height: 300px;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      margin-top: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #ffffff;
    }

    table {
      width: 100%;
      min-width: 550px; 
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th, td {
      white-space: nowrap; 
      padding: 12px 14px;
      color: var(--text-main);
    }

    td {
      border-bottom: 1px solid var(--border);
    }

    th {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: #f1f5f9;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: inset 0 -1px 0 var(--border);
    }

    tr:last-child td { border-bottom: none; }

    /* Tombol Aksi */
    .action-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-icon.edit { color: var(--primary); background-color: #eff6ff; }
    .btn-icon.edit:hover { background-color: #dbeafe; }
    
    .btn-icon.delete { color: var(--danger); background-color: #fef2f2; }
    .btn-icon.delete:hover { background-color: #fee2e2; }

    .empty-state {
      text-align: center;
      padding: 24px 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .modal-form-row { grid-template-columns: 1fr; }
      .form-actions { flex-direction: column; align-items: stretch; }
      .btn-submit { width: 100%; }
      .filter-group { flex-direction: column; align-items: stretch; padding: 10px; }
      .custom-date-group { padding: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. Total Modal di Tengah Atas -->
    <div class="top-stats-container">
      <div class="stat-card">
        <span class="label">Total Modal</span>
        <div class="value" id="summaryModal">Rp 0</div>
      </div>
    </div>

    <!-- 2. Bagian Pencatatan Modal Awal -->
    <div class="card">
      <h3 class="section-title">Pencatatan Modal Awal</h3>
      <form id="modalForm">
        <div class="modal-form-row">
          <div class="input-group">
            <label>Tanggal</label>
            <input type="date" id="modalTanggal" required />
          </div>
          <div class="input-group">
            <label>Nominal Modal</label>
            <div class="input-wrapper">
              <span>Rp</span>
              <input type="text" id="modalNominal" placeholder="0" required />
            </div>
          </div>
          <div class="input-group">
            <label>Keterangan (Untuk beli apa?)</label>
            <input type="text" id="modalKeterangan" placeholder="Contoh: Beli bahan baku" required />
          </div>
        </div>
        
        <!-- Tombol Aksi & Sortir di Kiri -->
        <div class="form-actions">
          <button type="submit" class="btn-submit" id="btnSubmitModal">Tambah Modal</button>
          
          <div class="filter-group">
            <select id="filterType">
              <option value="semua">Semua Waktu</option>
              <option value="harian">Sortir Harian</option>
              <option value="mingguan">Sortir Mingguan</option>
              <option value="bulanan">Sortir Bulanan</option>
              <option value="kustom">Rentang Tanggal</option>
            </select>

            <div id="customDateContainer" class="custom-date-group" style="display: none;">
              <input type="date" id="startDate" title="Tanggal Mulai" />
              <span style="color: var(--text-muted); font-weight: bold;">-</span>
              <input type="date" id="endDate" title="Tanggal Selesai" />
            </div>
          </div>
        </div>
      </form>

      <!-- Tabel Daftar Modal -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Keterangan</th>
              <th>Modal Awal</th>
              <th style="text-align: right;">Aksi</th>
            </tr>
          </thead>
          <tbody id="modalTableBody"></tbody>
        </table>
        <div id="emptyModalState" class="empty-state">Belum ada riwayat modal yang diinput.</div>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_BASE_URL = 'https://catatanmodal-default-rtdb.asia-southeast1.firebasedatabase.app';

    let modalMap = {};
    let editingModalKey = null; 

    const modalForm = document.getElementById('modalForm');
    const modalNominalInput = document.getElementById('modalNominal');
    const modalKeteranganInput = document.getElementById('modalKeterangan');
    const modalTanggalInput = document.getElementById('modalTanggal');
    const btnSubmitModal = document.getElementById('btnSubmitModal');
    
    // Elemen Filter
    const filterType = document.getElementById('filterType');
    const customDateContainer = document.getElementById('customDateContainer');
    const startDate = document.getElementById('startDate');
    const endDate = document.getElementById('endDate');

    const modalTableBody = document.getElementById('modalTableBody');
    const emptyModalState = document.getElementById('emptyModalState');
    const summaryModal = document.getElementById('summaryModal');

    modalTanggalInput.valueAsDate = new Date();

    // Event Listeners Filter
    filterType.addEventListener('change', (e) => {
      if (e.target.value === 'kustom') {
        customDateContainer.style.display = 'flex';
      } else {
        customDateContainer.style.display = 'none';
        startDate.value = '';
        endDate.value = '';
      }
      render();
    });

    startDate.addEventListener('change', render);
    endDate.addEventListener('change', render);

    function formatNumberString(str) {
      const clean = String(str).replace(/\D/g, '');
      if (!clean) return '';
      return new Intl.NumberFormat('id-ID').format(clean);
    }

    function parseFormattedNumber(str) {
      return parseFloat(String(str).replace(/\./g, '')) || 0;
    }

    function formatRupiah(amount) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency', currency: 'IDR', maximumFractionDigits: 0
      }).format(amount);
    }

    function attachThousandSeparator(inputElement) {
      inputElement.addEventListener('input', (e) => {
        const cursorPosition = e.target.selectionStart;
        const prevLength = e.target.value.length;
        const formatted = formatNumberString(e.target.value);
        e.target.value = formatted;
        const newLength = formatted.length;
        e.target.setSelectionRange(cursorPosition + (newLength - prevLength), cursorPosition + (newLength - prevLength));
      });
    }

    attachThousandSeparator(modalNominalInput);

    // Bantuan Parsing Tanggal Aman agar tidak terkena offset zona waktu
    function parseDateLocal(dateStr) {
      if (!dateStr) return null;
      const [y, m, d] = dateStr.split('-');
      return new Date(y, m - 1, d);
    }

    function render() {
      modalTableBody.innerHTML = '';
      const modalKeys = Object.keys(modalMap);
      let totalModalAmount = 0;

      if (modalKeys.length === 0) {
        emptyModalState.style.display = 'block';
        summaryModal.textContent = formatRupiah(0);
        return;
      } 

      // 1. Ubah ke array
      let modalList = modalKeys.map(key => {
        return { id: key, ...modalMap[key] };
      });

      // 2. Filter berdasarkan pilihan sortir
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      modalList = modalList.filter(m => {
        const itemDate = parseDateLocal(m.tanggal);
        const fType = filterType.value;

        if (fType === 'semua') return true;
        
        if (fType === 'harian') {
          return itemDate.getTime() === today.getTime();
        }
        
        if (fType === 'mingguan') {
          const lastWeek = new Date(today);
          lastWeek.setDate(today.getDate() - 7);
          return itemDate >= lastWeek && itemDate <= today;
        }
        
        if (fType === 'bulanan') {
          return itemDate.getMonth() === today.getMonth() && itemDate.getFullYear() === today.getFullYear();
        }
        
        if (fType === 'kustom') {
          const sDate = parseDateLocal(startDate.value);
          const eDate = parseDateLocal(endDate.value);
          
          if (sDate && eDate) return itemDate >= sDate && itemDate <= eDate;
          if (sDate) return itemDate >= sDate;
          if (eDate) return itemDate <= eDate;
          return true; 
        }

        return true;
      });

      // 3. Urutkan berdasarkan tanggal (Terbaru di atas)
      modalList.sort((a, b) => parseDateLocal(b.tanggal) - parseDateLocal(a.tanggal));

      if (modalList.length === 0) {
        emptyModalState.style.display = 'block';
        emptyModalState.textContent = 'Tidak ada modal pada rentang waktu ini.';
      } else {
        emptyModalState.style.display = 'none';
      }

      // 4. Render Row & Hitung Total
      modalList.forEach(m => {
        totalModalAmount += m.nominal;
        
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${m.tanggal}</td>
          <td><strong>${m.keterangan}</strong></td>
          <td>${formatRupiah(m.nominal)}</td>
          <td>
            <div class="action-btns">
              <button class="btn-icon edit" onclick="editModal('${m.id}')" title="Edit">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/></svg>
              </button>
              <button class="btn-icon delete" onclick="hapusModal('${m.id}')" title="Hapus">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>
              </button>
            </div>
          </td>
        `;
        modalTableBody.appendChild(row);
      });

      summaryModal.textContent = formatRupiah(totalModalAmount);
    }

    async function loadData() {
      try {
        const resModals = await fetch(`${FIREBASE_BASE_URL}/modals.json`);
        modalMap = (await resModals.json()) || {};
        render();
      } catch (err) {
        console.error('Koneksi Firebase gagal:', err);
      }
    }

    modalForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nominal = parseFormattedNumber(modalNominalInput.value);
      const keterangan = modalKeteranganInput.value.trim();
      const tanggal = modalTanggalInput.value;

      if (nominal <= 0 || !keterangan || !tanggal) return;

      btnSubmitModal.disabled = true;
      btnSubmitModal.textContent = 'Menyimpan...';

      const payload = { nominal, keterangan, tanggal };

      try {
        if (editingModalKey) {
          await fetch(`${FIREBASE_BASE_URL}/modals/${editingModalKey}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          modalMap[editingModalKey] = payload;
          editingModalKey = null; 
          btnSubmitModal.textContent = 'Tambah Modal';
          btnSubmitModal.classList.remove('btn-edit-mode');
        } else {
          const res = await fetch(`${FIREBASE_BASE_URL}/modals.json`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          modalMap[result.name] = payload;
        }
        
        render();
        modalForm.reset();
        modalTanggalInput.valueAsDate = new Date();
      } catch (err) {
        console.error('Gagal simpan modal:', err);
      } finally {
        btnSubmitModal.disabled = false;
        if(!editingModalKey) btnSubmitModal.textContent = 'Tambah Modal';
      }
    });

    function editModal(key) {
      const data = modalMap[key];
      modalNominalInput.value = formatNumberString(data.nominal);
      modalKeteranganInput.value = data.keterangan;
      modalTanggalInput.value = data.tanggal;
      
      editingModalKey = key;
      btnSubmitModal.textContent = 'Update Modal';
      btnSubmitModal.classList.add('btn-edit-mode');
      modalNominalInput.focus();
    }

    async function hapusModal(key) {
      if (!confirm('Hapus riwayat modal ini?')) return;
      delete modalMap[key];
      render(); 
      try {
        await fetch(`${FIREBASE_BASE_URL}/modals/${key}.json`, { method: 'DELETE' });
      } catch (err) {
        console.error('Gagal hapus modal', err);
        loadData(); 
      }
    }

    loadData();
  </script>
</body>
</html>
