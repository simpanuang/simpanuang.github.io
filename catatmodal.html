<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalkulator Penjualan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 12px;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* 3 Kolom Metrik Kompak Horizontal */
    .top-stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      width: 100%;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
    }

    .stat-card .label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .stat-card .value {
      font-size: 15px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .stat-card.profit .value { color: var(--success); }
    .stat-card.loss .value { color: var(--danger); }

    /* Kartu & Form Umum */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow-sm);
    }

    .section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-main);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-wrapper span {
      position: absolute;
      left: 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      pointer-events: none;
    }

    .input-wrapper input {
      padding-left: 36px !important;
    }

    input {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 13px;
      color: var(--text-main);
      background-color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .modal-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .item-grid {
      display: grid;
      grid-template-columns: 2fr 1.2fr 0.8fr auto;
      gap: 10px;
      align-items: flex-end;
    }

    .btn-submit {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
      height: 38px;
      white-space: nowrap;
      width: 100%;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }
    
    .btn-submit.btn-edit-mode {
      background-color: var(--warning);
    }

    /* Pengaturan Tabel (Geser Kanan-Kiri & Atas-Bawah) */
    .table-container {
      width: 100%;
      max-height: 220px; /* Membatasi tinggi agar muat sekitar 3 baris */
      overflow-y: auto; /* Mengaktifkan scroll atas-bawah */
      overflow-x: auto; /* Mengaktifkan scroll kanan-kiri */
      -webkit-overflow-scrolling: touch;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background-color: #ffffff;
    }

    table {
      width: 100%;
      min-width: 550px; 
      border-collapse: collapse;
      text-align: left;
      font-size: 13px;
    }

    th, td {
      white-space: nowrap; 
      padding: 12px 14px;
      color: var(--text-main);
    }

    td {
      border-bottom: 1px solid var(--border);
    }

    th {
      position: sticky; /* Membuat header tetap menempel saat di-scroll ke bawah */
      top: 0;
      z-index: 10;
      background-color: #f1f5f9;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      box-shadow: inset 0 -1px 0 var(--border); /* Pengganti border-bottom untuk efek sticky */
    }

    tr:last-child td { border-bottom: none; }

    /* Tombol Aksi (Icon) */
    .action-btns {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .btn-icon.edit { color: var(--primary); background-color: #eff6ff; }
    .btn-icon.edit:hover { background-color: #dbeafe; }
    
    .btn-icon.delete { color: var(--danger); background-color: #fef2f2; }
    .btn-icon.delete:hover { background-color: #fee2e2; }

    .empty-state {
      text-align: center;
      padding: 24px 0;
      color: var(--text-muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .top-stats-row { gap: 6px; }
      .stat-card { padding: 8px 10px; }
      .stat-card .label { font-size: 9px; }
      .stat-card .value { font-size: 13px; }
      .item-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. Tiga Kolom Metrik -->
    <div class="top-stats-row">
      <div class="stat-card">
        <span class="label">Total Modal</span>
        <div class="value" id="summaryModal">Rp 0</div>
      </div>
      <div class="stat-card">
        <span class="label">Total Pendapatan</span>
        <div class="value" id="summaryJual">Rp 0</div>
      </div>
      <div class="stat-card" id="cardLaba">
        <span class="label">Hasil Bersih</span>
        <div class="value" id="summaryLaba">Rp 0</div>
      </div>
    </div>

    <!-- 2. Bagian Pencatatan Modal Awal -->
    <div class="card">
      <h3 class="section-title">Pencatatan Modal Awal</h3>
      <form id="modalForm">
        <div class="modal-grid">
          <div class="input-group">
            <label>Nominal Modal</label>
            <div class="input-wrapper">
              <span>Rp</span>
              <input type="text" id="modalNominal" placeholder="0" required />
            </div>
          </div>
          <div class="input-group">
            <label>Keterangan (Untuk beli apa?)</label>
            <input type="text" id="modalKeterangan" placeholder="Contoh: Beli bahan baku" required />
          </div>
        </div>
        <div class="modal-grid">
          <div class="input-group">
            <label>Tanggal</label>
            <input type="date" id="modalTanggal" required />
          </div>
          <div class="input-group" style="justify-content: flex-end;">
            <button type="submit" class="btn-submit" id="btnSubmitModal">Tambah Modal</button>
          </div>
        </div>
      </form>

      <!-- Tabel Daftar Modal -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Tanggal</th>
              <th>Keterangan</th>
              <th>Modal Awal</th>
              <th style="text-align: right;">Aksi</th>
            </tr>
          </thead>
          <tbody id="modalTableBody"></tbody>
        </table>
        <div id="emptyModalState" class="empty-state">Belum ada riwayat modal yang diinput.</div>
      </div>
    </div>

    <!-- 3. Bagian Pencatatan Barang Penjualan -->
    <div class="card">
      <h3 class="section-title">Pencatatan Transaksi Penjualan</h3>
      <form id="itemForm" class="item-grid">
        <div class="input-group">
          <label>Nama Barang</label>
          <input type="text" id="namaBarang" placeholder="Contoh: Kemeja Polos" required />
        </div>
        <div class="input-group">
          <label>Harga Satuan</label>
          <div class="input-wrapper">
            <span>Rp</span>
            <input type="text" id="hargaJual" placeholder="0" required />
          </div>
        </div>
        <div class="input-group">
          <label>Jumlah (Qty)</label>
          <input type="text" id="qty" placeholder="1" value="1" required />
        </div>
        <button type="submit" class="btn-submit" id="btnSubmitItem">Tambah Penjualan</button>
      </form>

      <!-- Tabel Daftar Penjualan -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Nama Barang</th>
              <th>Harga Satuan</th>
              <th>Qty</th>
              <th>Subtotal</th>
              <th style="text-align: right;">Aksi</th>
            </tr>
          </thead>
          <tbody id="itemsTableBody"></tbody>
        </table>
        <div id="emptyItemState" class="empty-state">Belum ada data transaksi penjualan.</div>
      </div>
    </div>
  </div>

  <script>
    const FIREBASE_BASE_URL = 'https://catatanmodal-default-rtdb.asia-southeast1.firebasedatabase.app';

    let modalMap = {};
    let itemsMap = {};
    let editingModalKey = null; 

    const modalForm = document.getElementById('modalForm');
    const modalNominalInput = document.getElementById('modalNominal');
    const modalKeteranganInput = document.getElementById('modalKeterangan');
    const modalTanggalInput = document.getElementById('modalTanggal');
    const btnSubmitModal = document.getElementById('btnSubmitModal');
    const modalTableBody = document.getElementById('modalTableBody');
    const emptyModalState = document.getElementById('emptyModalState');

    const itemForm = document.getElementById('itemForm');
    const namaBarangInput = document.getElementById('namaBarang');
    const hargaJualInput = document.getElementById('hargaJual');
    const qtyInput = document.getElementById('qty');
    const btnSubmitItem = document.getElementById('btnSubmitItem');
    const itemsTableBody = document.getElementById('itemsTableBody');
    const emptyItemState = document.getElementById('emptyItemState');

    const summaryModal = document.getElementById('summaryModal');
    const summaryJual = document.getElementById('summaryJual');
    const summaryLaba = document.getElementById('summaryLaba');
    const cardLaba = document.getElementById('cardLaba');

    modalTanggalInput.valueAsDate = new Date();

    function formatNumberString(str) {
      const clean = String(str).replace(/\D/g, '');
      if (!clean) return '';
      return new Intl.NumberFormat('id-ID').format(clean);
    }

    function parseFormattedNumber(str) {
      return parseFloat(String(str).replace(/\./g, '')) || 0;
    }

    function formatRupiah(amount) {
      return new Intl.NumberFormat('id-ID', {
        style: 'currency', currency: 'IDR', maximumFractionDigits: 0
      }).format(amount);
    }

    function attachThousandSeparator(inputElement) {
      inputElement.addEventListener('input', (e) => {
        const cursorPosition = e.target.selectionStart;
        const prevLength = e.target.value.length;
        const formatted = formatNumberString(e.target.value);
        e.target.value = formatted;
        const newLength = formatted.length;
        e.target.setSelectionRange(cursorPosition + (newLength - prevLength), cursorPosition + (newLength - prevLength));
      });
    }

    attachThousandSeparator(modalNominalInput);
    attachThousandSeparator(hargaJualInput);
    attachThousandSeparator(qtyInput);

    function render() {
      // 1. Render Tabel Daftar Modal
      modalTableBody.innerHTML = '';
      const modalKeys = Object.keys(modalMap);
      let totalModalAmount = 0;

      if (modalKeys.length === 0) {
        emptyModalState.style.display = 'block';
      } else {
        emptyModalState.style.display = 'none';
        modalKeys.forEach(key => {
          const m = modalMap[key];
          totalModalAmount += m.nominal;
          
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${m.tanggal}</td>
            <td><strong>${m.keterangan}</strong></td>
            <td>${formatRupiah(m.nominal)}</td>
            <td>
              <div class="action-btns">
                <button class="btn-icon edit" onclick="editModal('${key}')" title="Edit">
                  <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207 11.207 2.5zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293l6.5-6.5zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325z"/></svg>
                </button>
                <button class="btn-icon delete" onclick="hapusModal('${key}')" title="Hapus">
                  <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>
                </button>
              </div>
            </td>
          `;
          modalTableBody.appendChild(row);
        });
      }

      // 2. Render Tabel Penjualan
      itemsTableBody.innerHTML = '';
      const itemKeys = Object.keys(itemsMap);
      let totalPenjualanAmount = 0;

      if (itemKeys.length === 0) {
        emptyItemState.style.display = 'block';
      } else {
        emptyItemState.style.display = 'none';
        itemKeys.forEach(key => {
          const item = itemsMap[key];
          const subtotal = item.harga * item.qty;
          totalPenjualanAmount += subtotal;

          const row = document.createElement('tr');
          row.innerHTML = `
            <td><strong>${item.nama}</strong></td>
            <td>${formatRupiah(item.harga)}</td>
            <td>${new Intl.NumberFormat('id-ID').format(item.qty)}</td>
            <td>${formatRupiah(subtotal)}</td>
            <td style="text-align: right;">
              <button class="btn-icon delete" onclick="hapusBarang('${key}')" style="margin-left:auto;" title="Hapus">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5zm3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0V6z"/><path fill-rule="evenodd" d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1v1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4H4.118zM2.5 3V2h11v1h-11z"/></svg>
              </button>
            </td>
          `;
          itemsTableBody.appendChild(row);
        });
      }

      // 3. Kalkulasi Summary
      const hasilBersih = totalPenjualanAmount - totalModalAmount;

      summaryModal.textContent = formatRupiah(totalModalAmount);
      summaryJual.textContent = formatRupiah(totalPenjualanAmount);
      summaryLaba.textContent = formatRupiah(hasilBersih);

      cardLaba.classList.remove('profit', 'loss');
      if (hasilBersih > 0) cardLaba.classList.add('profit');
      else if (hasilBersih < 0) cardLaba.classList.add('loss');
    }

    async function loadData() {
      try {
        const [resModals, resItems] = await Promise.all([
          fetch(`${FIREBASE_BASE_URL}/modals.json`),
          fetch(`${FIREBASE_BASE_URL}/items.json`)
        ]);
        
        modalMap = (await resModals.json()) || {};
        itemsMap = (await resItems.json()) || {};
        
        render();
      } catch (err) {
        console.error('Koneksi Firebase gagal:', err);
      }
    }

    modalForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nominal = parseFormattedNumber(modalNominalInput.value);
      const keterangan = modalKeteranganInput.value.trim();
      const tanggal = modalTanggalInput.value;

      if (nominal <= 0 || !keterangan || !tanggal) return;

      btnSubmitModal.disabled = true;
      btnSubmitModal.textContent = 'Menyimpan...';

      const payload = { nominal, keterangan, tanggal };

      try {
        if (editingModalKey) {
          await fetch(`${FIREBASE_BASE_URL}/modals/${editingModalKey}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          modalMap[editingModalKey] = payload;
          editingModalKey = null; 
          btnSubmitModal.textContent = 'Tambah Modal';
          btnSubmitModal.classList.remove('btn-edit-mode');
        } else {
          const res = await fetch(`${FIREBASE_BASE_URL}/modals.json`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const result = await res.json();
          modalMap[result.name] = payload;
        }
        
        render();
        modalForm.reset();
        modalTanggalInput.valueAsDate = new Date();
      } catch (err) {
        console.error('Gagal simpan modal:', err);
      } finally {
        btnSubmitModal.disabled = false;
        if(!editingModalKey) btnSubmitModal.textContent = 'Tambah Modal';
      }
    });

    function editModal(key) {
      const data = modalMap[key];
      modalNominalInput.value = formatNumberString(data.nominal);
      modalKeteranganInput.value = data.keterangan;
      modalTanggalInput.value = data.tanggal;
      
      editingModalKey = key;
      btnSubmitModal.textContent = 'Update Modal';
      btnSubmitModal.classList.add('btn-edit-mode');
      modalNominalInput.focus();
    }

    async function hapusModal(key) {
      if (!confirm('Hapus riwayat modal ini?')) return;
      delete modalMap[key];
      render(); 
      try {
        await fetch(`${FIREBASE_BASE_URL}/modals/${key}.json`, { method: 'DELETE' });
      } catch (err) {
        console.error('Gagal hapus modal', err);
        loadData(); 
      }
    }

    itemForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const nama = namaBarangInput.value.trim();
      const harga = parseFormattedNumber(hargaJualInput.value);
      const qty = parseFormattedNumber(qtyInput.value) || 1;

      if (!nama || harga <= 0) return;

      btnSubmitItem.disabled = true;
      btnSubmitItem.textContent = 'Menyimpan...';

      const payload = { nama, harga, qty };

      try {
        const res = await fetch(`${FIREBASE_BASE_URL}/items.json`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        
        itemsMap[result.name] = payload;
        render();

        itemForm.reset();
        qtyInput.value = '1';
        namaBarangInput.focus();
      } catch (error) {
        console.error('Gagal menambah barang:', error);
      } finally {
        btnSubmitItem.disabled = false;
        btnSubmitItem.textContent = 'Tambah Penjualan';
      }
    });

    async function hapusBarang(key) {
      if (!confirm('Hapus transaksi penjualan ini?')) return;
      delete itemsMap[key];
      render(); 
      try {
        await fetch(`${FIREBASE_BASE_URL}/items/${key}.json`, { method: 'DELETE' });
      } catch (error) {
        console.error('Gagal menghapus barang:', error);
        loadData(); 
      }
    }

    loadData();
  </script>
</body>
</html>
